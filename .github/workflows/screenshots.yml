name: Screenshots
run-name: Screenshots of ${{ inputs.after || 'the default branches' }}${{ inputs.scale != '1' && format(' at {0}x', inputs.scale) || '' }}

# Takes images of the main windows of BLACS, runmanager, lyse and runviewer on Windows,
# macOS and Linux, with example data, for each Qt binding and in the light and dark colour schemes: a
# "before" set with the default branches or the refs in `before`, with the platform's
# default Qt style and with Fusion, and an "after" set with the refs in `after`. See
# screenshots/README.md.

on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Component refs of the before set, as for test.yml (empty for the default branches)'
        default: ''
      after:
        description: 'Component refs of the after set, as for test.yml'
        default: ''
      after_styles:
        description: 'Qt styles of the after set: default, fusion or both'
        default: 'default fusion'
      sets:
        description: 'JSON list of the sets to take: before, after or both'
        default: '["before", "after"]'
      scale:
        description: 'Qt scale factor (QT_SCALE_FACTOR)'
        default: '1'
      pyqt5_dark:
        description: 'Also take dark images with PyQt5 (Windows only)'
        type: boolean
        default: false
      oses:
        description: 'JSON list of runner labels'
        default: '["windows-latest"]'
      qts:
        description: 'JSON list of Qt bindings'
        default: '["PySide6", "PyQt6", "PyQt5"]'
      python:
        description: 'Python version'
        default: '3.14'
      switch_scheme:
        description: 'Start each application with the other colour scheme and switch once the data is loaded'
        type: boolean
        default: false

env:
  BEFORE: ${{ inputs.before }}
  AFTER: ${{ inputs.after }}
  AFTER_STYLES: ${{ inputs.after_styles }}
  PYTHON: ${{ inputs.python }}
  SCALE: ${{ inputs.scale }}

jobs:
  screenshots:
    name: ${{ matrix.os }} ${{ matrix.set }} ${{ matrix.qt }} ${{ inputs.scale }}x
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses) }}
        set: ${{ fromJSON(inputs.sets) }}
        qt: ${{ fromJSON(inputs.qts) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON }}

      - name: Set the display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object Name, CurrentHorizontalResolution, CurrentVerticalResolution

      # The applications run on Xvfb with Ubuntu's default GTK theme and font in GTK's
      # settings file, which Qt 6's GTK platform theme reads.
      - name: Install Xvfb, the libraries of Qt's xcb platform, GTK and Ubuntu's theme
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb dbus-x11 libgtk-3-0t64 yaru-theme-gtk \
            yaru-theme-icon fonts-ubuntu \
            libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 \
            libfontconfig1 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install uv
        run: python -m pip install -q uv

      - name: Clone the components
        run: |
          if [ "${{ matrix.set }}" = before ]; then refs="$BEFORE"; else refs="$AFTER"; fi
          python harness/suite.py clone --repos-dir repos $refs

      - name: Install the components
        run: |
          python harness/suite.py install --repos-dir repos --venv venv --qt ${{ matrix.qt }} \
            --python "$(python -c 'import sys; print(sys.executable)')"

      - name: Make the profile and the example data
        run: |
          if [ "$RUNNER_OS" = Windows ]; then bin=Scripts; else bin=bin; fi
          venv/$bin/python screenshots/prepare.py "$RUNNER_TEMP/shared_drive"

      - name: Take the images
        run: |
          if [ "${{ matrix.set }}" = before ]; then styles="default fusion"; else styles="$AFTER_STYLES"; fi
          style_args=()
          for style in $styles; do
            style_args+=(--style "$style")
          done
          if [ "$SCALE" != 1 ]; then export QT_SCALE_FACTOR=$SCALE; fi
          if [ "$RUNNER_OS" = Linux ]; then
            Xvfb :99 -screen 0 1920x1080x24 &
            export DISPLAY=:99 XDG_CURRENT_DESKTOP=ubuntu:GNOME
            eval "$(dbus-launch --sh-syntax)"
            mkdir -p ~/.config/gtk-3.0
            sleep 2
          fi
          # On Windows, Qt 5 has a dark palette only when Windows is in dark mode.
          for scheme in light dark; do
            if [ ${{ matrix.qt }} = PyQt5 ] && [ $scheme = dark ] \
                && [ ${{ inputs.pyqt5_dark }} != true ]; then
              continue
            fi
            if [ "$RUNNER_OS" = Windows ]; then
              if [ $scheme = dark ]; then light=0; else light=1; fi
              reg add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' \
                //v AppsUseLightTheme //t REG_DWORD //d $light //f
            elif [ "$RUNNER_OS" = Linux ]; then
              if [ $scheme = dark ]; then theme=Yaru-dark; else theme=Yaru; fi
              printf '[Settings]\ngtk-theme-name=%s\ngtk-font-name=Ubuntu Sans 11\n' $theme \
                > ~/.config/gtk-3.0/settings.ini
            fi
            python screenshots/run_all.py --data "$RUNNER_TEMP/shared_drive/screenshots.json" \
              --out "out/${{ matrix.set }}" --venv ${{ matrix.qt }}=venv --scheme $scheme \
              "${style_args[@]}" ${{ inputs.switch_scheme && '--switch-scheme' || '' }}
          done
          ls out/${{ matrix.set }}

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots-${{ matrix.os }}-${{ matrix.set }}-${{ matrix.qt }}-${{ inputs.scale }}x
          path: out
          if-no-files-found: ignore
