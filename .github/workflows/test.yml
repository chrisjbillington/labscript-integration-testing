name: Test the labscript suite
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Test {0}', inputs.refs || 'the default branches') || 'Test the labscript suite' }}

# Runs harness/suite.py: installs the component repositories at the given refs into a
# virtual environment on each OS and Python version and runs the end-to-end checks.
# Conda is not used; see harness/README.md.
#
# Python 3.15 cannot be installed from PyPI until h5py ships wheels for it, so it is in
# the matrix of the weekly run only, where its jobs may fail.

on:
  push:
    paths:
      - 'harness/**'
      - '.github/workflows/test.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      refs:
        description: 'Component refs, space-separated: name=[owner/repo@]ref (ref is a branch, tag, commit or pr/N, the pull request merged into the current default branch; several name=pr/N for one component are merged in turn)'
        default: ''
      pins:
        description: 'Extra pip requirements for every job, space-separated, for example "numpy<2.5"'
        default: ''
      oses:
        description: 'JSON list of runner labels'
        default: '["ubuntu-latest", "windows-latest"]'
      pythons:
        description: 'JSON list of Python versions'
        default: '["3.11", "3.12", "3.13", "3.14"]'
      qts:
        description: 'JSON list of Qt bindings'
        default: '["PySide6", "PyQt6", "PyQt5"]'
      all_steps:
        description: 'Also run the steps that are skipped by default (the zprocess test suite)'
        type: boolean
        default: false

jobs:
  # A hash of the event name and the inputs for the concurrency groups of the test jobs,
  # since a concurrency group is limited to 400 characters.
  key:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - id: hash
        env:
          KEY: ${{ github.event_name }} ${{ toJSON(inputs) }}
        run: echo "hash=$(printf '%s' "$KEY" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }} py${{ matrix.python }} ${{ matrix.qt }} ${{ matrix.pins }}
    needs: key
    runs-on: ${{ matrix.os }}
    # A dispatch with the same inputs as a queued or running dispatch cancels its jobs.
    concurrency:
      group: ${{ github.workflow }} ${{ needs.key.outputs.hash }} ${{ matrix.os }} ${{ matrix.python }} ${{ matrix.qt }} ${{ matrix.pins }}
      cancel-in-progress: true
    timeout-minutes: 60
    continue-on-error: ${{ matrix.python == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.oses || '["ubuntu-latest", "windows-latest"]') }}
        python: ${{ fromJSON(inputs.pythons || (github.event_name == 'schedule' && '["3.11", "3.12", "3.13", "3.14", "3.15"]' || '["3.11", "3.12", "3.13", "3.14"]')) }}
        qt: ${{ fromJSON(inputs.qts || '["PySide6", "PyQt6", "PyQt5"]') }}
        pins: ['${{ inputs.pins }}']
        # The harness installs PySide6<6.12, which has no release for Python 3.15.
        exclude:
          - python: '3.15'
            qt: PySide6
        include:
          # One job with NumPy older than 2.5.
          - os: ubuntu-latest
            python: '3.14'
            qt: PySide6
            pins: numpy<2.5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the system libraries that Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libfontconfig1 libglib2.0-0 libxcb-cursor0

      - name: Install uv
        run: python -m pip install -q uv

      - name: Clone the components
        shell: bash
        run: python harness/suite.py clone --repos-dir repos ${{ inputs.refs }}

      - name: Install the components
        shell: bash
        env:
          PINS: ${{ matrix.pins }}
        run: |
          args=()
          for pin in $PINS; do
            args+=(--pin "$pin")
          done
          python harness/suite.py install --repos-dir repos --venv venv --qt ${{ matrix.qt }} \
            --python "$(python -c 'import sys; print(sys.executable)')" "${args[@]}"

      - name: Run the checks
        shell: bash
        run: |
          args=()
          if [ "${{ inputs.all_steps }}" = "true" ]; then
            args+=(--all)
          fi
          python harness/suite.py test --venv venv --work work "${args[@]}"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-${{ matrix.os }}-py${{ matrix.python }}-${{ matrix.qt }}${{ matrix.pins && '-pinned' || '' }}
          path: |
            work/logs
            work/report.md
            work/state.json
          if-no-files-found: ignore
